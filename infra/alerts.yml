groups:
  - name: llm-service
    rules:
      - alert: HighErrorRate
        expr: sum(rate(llm_requests_total{status="error"}[1m])) / sum(rate(llm_requests_total[1m])) > 0.2
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "More than 20% of /ask requests are failing"
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(llm_request_latency_seconds_bucket[1m]))) > 8
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "p95 latency has been above 8 seconds for 1 minute"
